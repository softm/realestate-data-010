name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints; auto combines historical collection and recent refresh'
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  regional:
    if: github.event_name != 'schedule' || vars.COLLECTION_ENABLED != 'false'
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@0963c153924d2429dacf69dc82fdf61d0ceb4761
    with:
      engine_ref: 0963c153924d2429dacf69dc82fdf61d0ceb4761
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
