name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints and incomplete pages within existing request budgets'
  schedule:
    - cron: '35 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  regional:
    if: github.event_name != 'schedule' || vars.COLLECTION_ENABLED != 'false'
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@3a29ba653e18b0844b82184d77b63a90bb992769
    with:
      engine_ref: 3a29ba653e18b0844b82184d77b63a90bb992769
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
